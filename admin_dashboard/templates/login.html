{% extends 'base.html' %}
{% load i18n %}
{% block content %}

<div class="d-flex justify-content-center pt-3">
  <div class="text-center p-4 border rounded shadow-sm bg-body-tertiary w-100" style="max-width: 500px">
  <form method="POST" action="{% url 'login' %}">
    {% csrf_token %}
    <h1>{% trans 'Login' %}</h1>
    <br />
    <div class="mb-3">
      <input
        type="text"
        class="form-control"
        name="username"
        placeholder="{% trans 'Username' %}"
        required
      />
    </div>
    <div class="mb-3">
      <input
        type="password"
        class="form-control"
        name="password"
        placeholder="{%  trans 'Password' %}"
        required
      />
    </div>
    <button type="submit" class="btn btn-primary">{% trans 'Log in' %}</button>
  </form>
  </div>  
</div>

{% endblock %}
